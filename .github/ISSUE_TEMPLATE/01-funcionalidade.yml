name: Funcionalidade
description: Solicitar uma nova capacidade ou melhoria percebida pelo usuário.
title: "[Funcionalidade] "
type: Funcionalidade

body:
  - type: markdown
    attributes:
      value: |
        Descreva a necessidade e o resultado esperado. A solução poderá ser definida durante o refinamento.

  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual problema, necessidade ou oportunidade originou esta demanda?
      placeholder: Descreva o cenário atual e quem é afetado.
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qual resultado deve ser alcançado?
      placeholder: Permitir que...
    validations:
      required: true

  - type: textarea
    id: escopo
    attributes:
      label: Escopo esperado
      description: Liste o que deve estar contemplado nesta entrega.
      placeholder: |
        - Item 1
        - Item 2
        - Item 3
    validations:
      required: true

  - type: textarea
    id: fora-escopo
    attributes:
      label: Fora do escopo
      description: Registre o que não deverá fazer parte desta entrega, quando conhecido.
      placeholder: |
        - Item não contemplado
    validations:
      required: false

  - type: textarea
    id: criterios-aceite
    attributes:
      label: Critérios de aceite
      description: Informe condições verificáveis para considerar a entrega aceita.
      placeholder: |
        - [ ] Dado que..., quando..., então...
        - [ ] O sistema deve...
    validations:
      required: true

  - type: textarea
    id: referencias
    attributes:
      label: Referências
      description: Inclua protótipos, documentos, prints, regras, APIs ou links relacionados.
    validations:
      required: false